# wandb sweep config
seed:
  value: 42

deterministic:
  value: true

epochs:
  values: [50,100, 150, 200]

batch_size:
  values: [16, 32, 64]

num_workers: 
  value: 8

# optimizer

optimizer:
  values: [AdamW, Adam, SGD]

weight_decay:
  distribution: uniform
  min: 0.00001  # 1e-5
  max: 0.0005  # 5e-4

momentum:
  distribution: uniform
  min: 0.9
  max: 0.99

# warmup
warmup_epochs_ratio:
  values: [0.05, 0.1, 0.15, 0.2]

warmup_type:
  value: cosine  
#[linear, cosine, exponential]
 
warmup_start_factor:
  values: [0.01, 0.001]


# main lr
main_lr_type:
  value: cosine
# [cosine, one_cycle, poly, linear]


# decoder lr
decoder_lr:
  distribution: uniform
  min: 0.01
  max: 0.1

# encoder lr factor
encoder_lr_factor:
  distribution: uniform
  min: 0.1
  max: 0.8


# loss
loss_type:
  values: [[dice, bce], [focal, bce], [dice, focal]]

alpha:
  distribution: uniform
  min: 0.25
  max: 0.75