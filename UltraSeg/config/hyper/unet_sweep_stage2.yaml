# wandb sweep config
seed:
  value: 42

epochs:
  values: [50,100, 150]

batch_size:
  values: [32, 64]


# optimizer

optimizer:
  value: AdamW

weight_decay:
  distribution: uniform
  min: 0.00001  # 1e-5
  max: 0.0005  # 5e-4

momentum:
  distribution: uniform
  min: 0.9
  max: 0.99

# warmup
warmup_epochs_ratio:
  values: [0.1, 0.15, 0.2]

warmup_type:
  value: cosine  
#[linear, cosine, exponential]
 
warmup_start_factor:
  value: 0.001


# main lr
main_lr_type:
  value: cosine


# decoder lr
decoder_lr:
  distribution: uniform
  min: 0.001
  max: 0.01

# encoder lr factor
encoder_lr_factor:
  distribution: uniform
  min: 0.1
  max: 0.8


# loss
loss_type:
  values: [[dice, bce], [focal, bce], [dice, focal]]

alpha:
  distribution: uniform
  min: 0.25
  max: 0.75