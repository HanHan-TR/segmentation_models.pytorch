# wandb sweep config
seed:
  value: 42

epochs:
  distribution: q_uniform
  min: 50
  max: 150
  q: 20

batch_size:
  values: [16, 32]


# optimizer
optimizer:
  value: AdamW

weight_decay:
  distribution: uniform
  min: 0.00001  # 1e-5
  max: 0.0005  # 5e-4

momentum:
  value: 0.99   # not used for AdamW, but for other optimizers like SGD, it can be tuned

# warmup
warmup_epochs_ratio:
  values: [0.1, 0.2, 0.3]

warmup_type:
  value: cosine  
#  [linear, cosine, exponential]
 
warmup_start_factor:
  values: [0.01, 0.001]


# main lr
main_lr_type:
  value: cosine

# decoder lr
decoder_lr:
  distribution: uniform
  min: 0.01
  max: 0.1

# encoder lr factor
encoder_lr_factor:
  distribution: uniform
  min: 0.1
  max: 0.5


# loss
loss_type:
  values: [[dice, bce], [focal, bce], [dice, focal]]

alpha:
  distribution: uniform
  min: 0.25
  max: 0.75

ema_decay:
  distribution: q_uniform
  min: 0.9
  max: 0.999
  q: 0.005
  