# wandb sweep config
seed:
  value: 42

epochs:
  distribution: q_uniform
  min: 80
  max: 140
  q: 10

batch_size:
  values: [16, 32]


# optimizer
optimizer:
  value: AdamW

weight_decay:
  distribution: uniform
  min: 0.00001  # 1e-5
  max: 0.0005  # 5e-4

momentum:
  value: 0.99   # not used for AdamW, but for other optimizers like SGD, it can be tuned

# warmup
warmup_epochs_ratio:
  values: [0.2, 0.3]

warmup_type:
  value: cosine  
#  [linear, cosine, exponential]
 
warmup_start_factor:
  value: 0.01


# main lr
main_lr_type:
  value: cosine

# decoder lr
decoder_lr:
  distribution: uniform
  min: 0.02
  max: 0.07

# encoder lr factor
encoder_lr_factor:
  distribution: uniform
  min: 0.16
  max: 0.4


# loss
loss_type:
  values: [[dice, bce], [focal, bce], [dice, focal]]

alpha:
  distribution: uniform
  min: 0.5
  max: 0.7

ema_decay:
  distribution: q_uniform
  min: 0.9
  max: 0.999
  q: 0.005
  